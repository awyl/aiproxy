[package]
name = "aiproxy"
version = "0.1.0"
edition = "2024"
default-run = "aiproxy"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
futures = "0.3"
bytes = "1"
async-trait = "0.1"
fastembed = { version = "6", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }
regex = "1"
rmcp = { version = "=3.1.4", features = ["server", "client", "transport-streamable-http-server", "transport-streamable-http-client-reqwest", "transport-child-process", "transport-io", "tower"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tempfile = "3"